<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse-slow {
        animation: pulseSlow 6s ease-in-out infinite alternate;
      }
      .wave-bar {
        animation: waveAnim 1.6s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .node-pulse {
        animation: nodeGlow 2.5s ease-in-out infinite;
      }
      .packet-flow {
        stroke-dasharray: 8 16;
        animation: dashFlow 4s linear infinite;
      }
      .beacon-ring {
        animation: beaconRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: center;
      }

      @keyframes pulseSlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes waveAnim {
        0% { transform: scaleY(0.25); }
        50% { transform: scaleY(0.9); }
        100% { transform: scaleY(0.35); }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.4; r: 4px; }
        50% { opacity: 0.95; r: 7px; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 96; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes beaconRing {
        0% { r: 5px; opacity: 1; }
        100% { r: 22px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle cx="200" cy="120" r="180" fill="url(#cyanGlow)" class="pulse-slow"/>
  <circle cx="1020" cy="300" r="220" fill="url(#purpleGlow)" class="pulse-slow" style="animation-delay: -3s;"/>
  <circle cx="600" cy="210" r="260" fill="url(#blueGlow)"/>

  <!-- Network Topology Signal Lines (Dynamic Animated Packets) -->
  <g fill="none" stroke-linecap="round">
    <!-- Connecting Path 1 -->
    <path d="M 80 340 Q 220 310, 360 350 T 640 330 T 920 360 T 1120 320" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M 80 340 Q 220 310, 360 350 T 640 330 T 920 360 T 1120 320" stroke="#38bdf8" stroke-width="2.5" class="packet-flow"/>

    <!-- Connecting Path 2 -->
    <path d="M 100 80 Q 300 130, 500 90 T 900 110 T 1100 70" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M 100 80 Q 300 130, 500 90 T 900 110 T 1100 70" stroke="#a78bfa" stroke-width="2" class="packet-flow" style="animation-duration: 6s;"/>
  </g>

  <!-- Animated Audio/Video Equalizer Spectrum (Right Side, Subtle) -->
  <g transform="translate(1000, 180)" fill="url(#accentGrad)" opacity="0.45">
    <rect class="wave-bar" x="0" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.1s; animation-delay: 0.1s;"/>
    <rect class="wave-bar" x="9" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.4s; animation-delay: 0.3s;"/>
    <rect class="wave-bar" x="18" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.0s; animation-delay: 0.2s;"/>
    <rect class="wave-bar" x="27" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.7s; animation-delay: 0.5s;"/>
    <rect class="wave-bar" x="36" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.3s; animation-delay: 0.4s;"/>
    <rect class="wave-bar" x="45" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.5s; animation-delay: 0.2s;"/>
    <rect class="wave-bar" x="54" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.2s; animation-delay: 0.6s;"/>
    <rect class="wave-bar" x="63" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.6s; animation-delay: 0.1s;"/>
    <rect class="wave-bar" x="72" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.3s; animation-delay: 0.3s;"/>
    <rect class="wave-bar" x="81" y="-70" width="4" height="70" rx="2" style="animation-duration: 1.8s; animation-delay: 0.5s;"/>
  </g>

  <!-- Live Status Beacon (Top Right) -->
  <g transform="translate(1070, 48)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#22c55e" stroke-width="2" class="beacon-ring"/>
    <circle cx="0" cy="0" r="5" fill="#22c55e" filter="url(#glowFilter)"/>
    <text x="16" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80" letter-spacing="1.5">LIVE PEER</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Badges (Layered on Top) -->
  <g transform="translate(80, 0)">
    
    <!-- Mini Category Tag -->
    <g transform="translate(0, 75)">
      <rect width="190" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8" class="node-pulse"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" letter-spacing="1.2">REAL-TIME MEDIA STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#titleGrad)" filter="url(#shadow)">
      Awesome WebRTC &amp; Real-Time Video
    </text>

    <!-- Subtitle -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" filter="url(#shadow)">
      Curated Guide to SFU Media Servers, Live Streaming, Video Conferencing &amp; Low-Latency APIs
    </text>

    <!-- Feature Pills / Badges (Clear High Contrast Foreground) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: WebRTC Core -->
      <g transform="translate(0, 0)">
        <rect width="150" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">⚡ WebRTC Core</text>
      </g>
      
      <!-- Pill 2: SFU & MCU Servers -->
      <g transform="translate(162, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">🎛️ SFU &amp; MCU Servers</text>
      </g>

      <!-- Pill 3: Sub-500ms Latency -->
      <g transform="translate(349, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">⏱️ Sub-500ms Latency</text>
      </g>

      <!-- Pill 4: Real-Time AI Agents -->
      <g transform="translate(536, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#f472b6" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f472b6">🤖 Real-Time AI Agents</text>
      </g>

      <!-- Pill 5: STUN / TURN Traversal -->
      <g transform="translate(723, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">🌐 STUN/TURN Traversal</text>
      </g>
    </g>

    <!-- Bottom Metadata Stats Bar -->
    <g transform="translate(0, 312)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
        <tspan fill="#38bdf8" font-weight="700">Open Source &amp; SaaS</tspan> • 
        <tspan fill="#e2e8f0" font-weight="500"> Production SFU Routers</tspan> • 
        <tspan fill="#e2e8f0" font-weight="500"> SDKs for Web, iOS, Android, Flutter &amp; React Native</tspan>
      </text>
    </g>
  </g>
</svg>
